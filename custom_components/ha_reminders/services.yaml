delete:
  name: Delete reminder
  description: Delete a reminder.
  fields:
    reminder_id:
      required: true
      selector:
        entity:
          domain: sensor

list:
  name: List reminders
  description: List all reminders with their runtime status.

snooze:
  name: Snooze reminder
  description: Snooze a reminder notification for a number of minutes.
  fields:
    reminder_id:
      required: true
      selector:
        entity:
          domain: sensor
    minutes:
      required: true
      selector:
        number:
          min: 1
          mode: box

complete:
  name: Complete reminder
  description: Acknowledge a reminder (runs its acknowledge actions and notifies the rest of the group).
  fields:
    reminder_id:
      required: true
      selector:
        entity:
          domain: sensor
    user_name:
      selector:
        text: {}

set_enabled:
  name: Set reminder enabled
  description: Enable or disable a reminder.
  fields:
    reminder_id:
      required: true
      selector:
        entity:
          domain: sensor
    enabled:
      required: true
      selector:
        boolean: {}