name: Build card

on:
  push:
  pull_request:

jobs:
  build:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: card/package-lock.json

      - name: Install dependencies
        working-directory: card
        run: npm ci

      - name: Lint
        working-directory: card
        run: npm run lint

      - name: Build
        working-directory: card
        run: npm run build

      - name: Dist is committed and up to date
        run: git diff --exit-code -- custom_components/ha_reminders/www/ha-reminders.js